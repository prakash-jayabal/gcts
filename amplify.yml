version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
    discardPaths: no
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  customHeaders:
    - pattern: '**/*.{js,css,html,ico,png,jpg,jpeg,gif,svg,webp}'
      headers:
        - key: Cache-Control
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.html'
      headers:
        - key: Cache-Control
          value: 'public, max-age=0, must-revalidate'
    - pattern: '**/api/*'
      headers:
        - key: Cache-Control
          value: 'no-cache, no-store, must-revalidate'
    - pattern: '**/*.{woff,woff2,ttf,eot}'
      headers:
        - key: Cache-Control
          value: 'public, max-age=31536000, immutable'
  redirects:
    - source: '/admin<regex:.*>'
      destination: '/admin/dashboard'
      status: 302
    - source: '/member<regex:.*>'
      destination: '/member/dashboard'
      status: 302
    - source: '/volunteer<regex:.*>'
      destination: '/volunteer/dashboard'
      status: 302
  rewrites:
    - source: '/api/<regex:.*>'
      destination: 'https://api.cincinnatitamil.org/api/:splat'
      status: 200
